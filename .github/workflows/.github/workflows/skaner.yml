name: Skaner intraday
on:
  schedule:
    - cron: "25 13 * * 1-5"
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scan.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOP_AT_UTC: ${{ github.event.schedule == '25 13 * * 1-5' && '18:30' || '' }}
